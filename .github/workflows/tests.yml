name: Plugin tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -c tests/pytest.ini --rootdir tests tests
      - run: node --check desktop/plugin.js
  hermes-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        hermes: ['90d6b98fd86d20981ee06ddd5b7d93e4320f26a4', '6b21d0564de0492e2ebd0d8f63fca86c03b5c892']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate with the reviewed Hermes toolchain and catalog checks
        uses: NousResearch/hermes-agent/.github/actions/plugin-validate@90d6b98fd86d20981ee06ddd5b7d93e4320f26a4
        with:
          path: .
          hermes-ref: ${{ matrix.hermes }}
