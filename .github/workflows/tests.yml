name: Plugin tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -c tests/pytest.ini --rootdir tests tests
      - run: node --check desktop/plugin.js
  helper-sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        hermes: ['90d6b98fd86d20981ee06ddd5b7d93e4320f26a4', '6b21d0564de0492e2ebd0d8f63fca86c03b5c892']
    steps:
      - uses: actions/checkout@v4
      - name: Read the reviewed public helper usage boundary
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: .reviewed-hermes-sdk
          sparse-checkout: agent/plugin_llm.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Exercise actual SDK usage conversion without host startup
        env:
          CRYSTAL_HERMES_LLM_SOURCE: ${{ github.workspace }}/.reviewed-hermes-sdk/agent/plugin_llm.py
        run: >-
          python -m pytest -c tests/pytest.ini --rootdir tests
          tests/test_sdk_usage_and_reply_recovery.py::test_reviewed_sdk_source_cannot_turn_missing_cache_metadata_into_a_low_estimate
  hermes-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        hermes: ['90d6b98fd86d20981ee06ddd5b7d93e4320f26a4', '6b21d0564de0492e2ebd0d8f63fca86c03b5c892']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate with the reviewed Hermes toolchain and catalog checks
        uses: NousResearch/hermes-agent/.github/actions/plugin-validate@90d6b98fd86d20981ee06ddd5b7d93e4320f26a4
        with:
          path: .
          hermes-ref: ${{ matrix.hermes }}
