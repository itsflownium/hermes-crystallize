name: crystallize
version: 0.5.2
manifest_version: 2
api_version: 1
description: >-
  Helps normal chats and cron jobs spend less on repeated context and tool work.
  Preserves reasoning settings, keeps recoverable originals, and shows quality
  checks, uncertainty and comparable-settings receipts across cloud providers.
  Supports explicitly reviewed native Python snapshot sources for local cron jobs.
author: itsflownium
license: MIT
homepage: https://github.com/itsflownium/hermes-crystallize
tags: [automation, cost, cron, chat, reliability]
requires_hermes: ">=0.22.7"

provides_tools:
  - crystal_list
  - crystal_run
  - crystal_full_result
  - crystal_cheap

provides_hooks:
  - post_tool_call
  - on_session_end
  - transform_tool_result
  - pre_llm_call
  - transform_llm_output
  - post_api_request
  - pre_tool_call

provides_middleware:
  - llm_request
  - tool_execution

config_schema:
  capture_enabled:
    type: bool
    default: true
    label: Record tool calls
    description: Record which tools Hermes calls so Crystallize can spot repeated routines.
  result_preview_chars:
    type: int
    default: 2000
    label: Result preview length
    description: Display preview length. Complete Cron evidence is captured separately within bounded storage limits.
