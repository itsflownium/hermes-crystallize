name: crystallize
version: 0.2.0
manifest_version: 2
api_version: 1
description: >-
  Makes Hermes cron jobs cheaper on any cloud model. Trims the tools, AI calls, tool
  results and reasoning each job pays for, turns repeated work into proven step lists,
  and keeps a change only if the job's answers hold up and its cost really fell.
author: itsflownium
license: MIT
homepage: https://github.com/itsflownium/hermes-crystallize
tags: [automation, cost, cron, reliability]
requires_hermes: ">=0.22.7"

provides_tools:
  - crystal_list
  - crystal_run
  - crystal_full_result
  - crystal_cheap

provides_hooks:
  - post_tool_call
  - on_session_end
  - transform_tool_result
  - pre_llm_call
  - transform_llm_output
  - post_api_request
  - pre_tool_call

config_schema:
  capture_enabled:
    type: bool
    default: true
    label: Record tool calls
    description: Record which tools Hermes calls so Crystallize can spot repeated routines.
  result_preview_chars:
    type: int
    default: 2000
    label: Result preview length
    description: How many characters of each tool result to keep for comparing runs.
