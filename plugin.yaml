name: crystallize
version: 0.5.3
manifest_version: 2
api_version: 1
description: >-
  Works to lower the cost of repeated context and tool work in Hermes chats and cron
  jobs, without lowering reasoning. Keeps originals recoverable, shows quality checks
  and only counts savings between runs with matching settings. Can skip cron runs when
  a reviewed snapshot script shows nothing changed.
author: itsflownium
license: MIT
homepage: https://github.com/itsflownium/hermes-crystallize
tags: [automation, cost, cron, chat, reliability]
requires_hermes: ">=0.22.7"

provides_tools:
  - crystal_list
  - crystal_run
  - crystal_full_result
  - crystal_cheap

provides_hooks:
  - post_tool_call
  - on_session_end
  - transform_tool_result
  - pre_llm_call
  - transform_llm_output
  - post_api_request
  - pre_tool_call

provides_middleware:
  - llm_request
  - tool_execution

config_schema:
  capture_enabled:
    type: bool
    default: true
    label: Record tool calls
    description: Record which tools Hermes calls so Crystallize can spot repeated routines.
  result_preview_chars:
    type: int
    default: 2000
    label: Result preview length
    description: Display preview length. Complete Cron evidence is captured separately within bounded storage limits.
